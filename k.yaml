services:
  - type: web
    name: my-profile-website
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "clear"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_PASSWORD           # Mật khẩu vào /admin — Render sẽ hỏi khi tạo
        sync: false
      - key: UPSTASH_REDIS_REST_URL   # Lấy ở Upstash → Database → REST API (xem README mục 5)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: NODE_VERSION
        value: "22"
